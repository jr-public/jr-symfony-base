services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/var
      - ./docker/000-default.conf:/etc/apache2/sites-available/000-default.conf
      - ./docker/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
    environment:
      APP_ENV: dev
    restart: unless-stopped